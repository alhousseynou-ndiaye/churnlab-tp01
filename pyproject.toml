[project]
name = "churnlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alhousseynou-ndiaye", email = "alhousseynoundiaye8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlflow>=3,<4",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
churnlab = "churnlab:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]